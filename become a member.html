<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./AI.css">
</head>
<body>
     <h1 class="name"><b>REGISTRATION FORM</b></h1>

        <form action="">

                <label class="sam" for="Full name">User name</label><br>
                <input class="isa" type="text" required placeholder="Username"><br>

                <label class="sam"for="Password">Password</label><br>
                <input  class="isa" type="password" required placeholder="Enter your password"><br>

                <label class="sam"for="Confirm password">Confirm password</label><br>
                <input class="isa" type="password" required placeholder="Confirm your password"><br>

                <label class="sam" for="Gender">Gender</label><br>

                 <select class="uu" name="Gender" id="Gender"><br>
                    <option value="Boy">Boy</option>
                    <option value="Girl">Girl</option>
                </select><br>

                <label class="sam" for="Date of Birth">Date of Birth</label>
                <input  class="isa"type="datetime-local"><br>

                <label class="sam"for="Phone Number">Phone Number</label><br>
                <input  class="isa"type="number" required><br>

                <label class="sam" for="Email">Email</label><br>
                <input  class="isa"type="email" required placeholder=" Enter your email"><br>

                <label class="sam" for="Address">Address</label><br>
                <input  class="isa"type="address" required placeholder="Enter your address"><br><br>

                <input  class="is"type="login" value="Submit">

                
            </form>
</body>
</html>
